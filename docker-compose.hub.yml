# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  TILI RAG — Docker Compose (Pre-built Images)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  For users pulling from Docker Hub
#  Usage:
#    docker-compose up        # Start
#    docker-compose down      # Stop
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

services:
  # ── Backend: FastAPI + RAG Pipeline ──
  api:
    image: fedihmida/hackathon:api
    container_name: tili-api
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - chroma_data:/app/RAG/chroma_db
      - ./pdf:/app/docs/pdf
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Frontend: React + Nginx ──
  web:
    image: fedihmida/hackathon:web
    container_name: tili-web
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  chroma_data:
